<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Operations Portal</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f6fa; }
    body { margin: 0; } main { max-width: 980px; margin: 0 auto; padding: 42px 24px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: 32px; } p { color: #637087; margin: 0; }
    .badge { background: #fff4dd; color: #8a5a00; border-radius: 999px; padding: 7px 12px; font-size: 13px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .card { background: #fff; border: 1px solid #e1e6ef; border-radius: 14px; padding: 20px; box-shadow: 0 4px 16px #1720330b; }
    .card.selected { border-color: #315efb; box-shadow: 0 0 0 3px #315efb18; } .card h2 { font-size: 18px; margin: 0 0 12px; }
    .meta { display: flex; justify-content: space-between; gap: 12px; color: #637087; font-size: 14px; margin: 8px 0; }
    .status { color: #315efb; font-weight: 700; font-size: 13px; } .reason { margin: 16px 0; line-height: 1.5; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 700; cursor: pointer; margin-right: 8px; } button:disabled { cursor: not-allowed; opacity: .45; }
    .approve { background: #d9f5e8; color: #146b45; } .reject { background: #ffe0e0; color: #9a2e2e; }
    textarea { width: 100%; min-height: 74px; border: 1px solid #d7deea; border-radius: 9px; padding: 10px; box-sizing: border-box; margin: 8px 0 12px; font: inherit; }
    #message { margin: 18px 0; min-height: 20px; font-weight: 600; } .empty { color: #637087; padding: 20px 0; }
    @media (max-width: 720px) { header { display: block; } .badge { display: inline-block; margin-top: 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>訂單人工覆核</h1><p>Order Operations Portal · synthetic staging demo</p></div><span class="badge">Production blocked</span></header>
  <div id="message"></div><section id="orders" class="grid"></section>
</main>
<script>
let selected = null;
const money = n => `NT$ ${n.toLocaleString()}`;
async function load() {
  const res = await fetch('/api/orders'); const orders = await res.json();
  const root = document.querySelector('#orders'); root.innerHTML = '';
  orders.forEach(order => {
    const card = document.createElement('article'); card.className = 'card' + (selected === order.id ? ' selected' : '');
    card.innerHTML = `<h2>${order.id}</h2><div class="meta"><span>${order.customer}</span><strong>${money(order.amount)}</strong></div><div class="status">${order.status}</div><p class="reason">${order.reason}</p>${order.note ? `<p><strong>覆核備註：</strong>${order.note}</p>` : ''}${order.status === 'PENDING_REVIEW' ? `<textarea id="note-${order.id}" placeholder="請輸入覆核理由（必填）"></textarea><button class="approve" onclick="review('${order.id}','APPROVED')">核准</button><button class="reject" onclick="review('${order.id}','REJECTED')">退回</button>` : ''}`;
    root.appendChild(card);
  });
  if (!orders.length) root.innerHTML = '<p class="empty">目前沒有待覆核訂單。</p>';
}
async function review(id, decision) {
  selected = id; const note = document.querySelector(`#note-${id}`).value;
  const res = await fetch(`/api/orders/${id}/review`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({decision, note}) });
  const body = await res.json(); const message = document.querySelector('#message');
  message.textContent = res.ok ? `${id} 已${decision === 'APPROVED' ? '核准' : '退回'}，結果已記錄。` : `無法送出：${body.error}`;
  message.style.color = res.ok ? '#146b45' : '#9a2e2e'; await load();
}
load();
</script>
</body>
</html>
