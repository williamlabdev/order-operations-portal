apiVersion: context-rail/v1alpha1
kind: Project
metadata:
  id: order-operations-portal
  name: Order Operations Portal
  version: 1
  classification: internal
  demo: true
spec:
  purpose: Give operations staff a controlled way to review order exceptions before fulfillment.
  owners:
    technical: demo/platform
    business: demo/operations
  repository:
    provider: github
    visibility: private
    url: github.com/example/order-operations-portal
    defaultBranch: main
    status: fixture-pending-remote
  service:
    id: order-operations-web
    runtime: go
    sourcePath: .
  environments:
    - id: development
      type: development
      sequence: 1
      targetRef: local
      requiredEvidence: [local-test]
    - id: testing
      type: testing
      sequence: 2
      targetRef: ci
      requiredEvidence: [test, build, code-review]
    - id: staging
      type: staging
      sequence: 3
      targetRef: cloud-run/order-operations-portal-staging
      requiredEvidence: [decision-record, code-review, test, build, smoke]
    - id: production
      type: production
      sequence: 4
      targetRef: protected/read-only
      requiredEvidence: [release-approval, staging-receipt, smoke]
      action: blocked-in-demo
  promotionPolicy:
    developmentToTesting: testing evidence and independent code review required
    testingToStaging: accepted decision, matching commit, build identity and staging smoke required
    stagingToProduction: human release approval required; production remains blocked in this demo
  commands:
    test: go test ./...
    run: go run .
    build: go build -o bin/order-operations-portal .
    validate: ./scripts/validate-demo.sh
    deployStaging: ./scripts/deploy-staging.sh
  documents:
    - path: project.yaml
      kind: project-manifest
      sourceOfTruth: true
      requiredFor: [decision, development, staging]
    - path: README.md
      kind: human-entry
      sourceOfTruth: true
      requiredFor: [decision, development]
    - path: vision.md
      kind: product-intent
      sourceOfTruth: true
      requiredFor: [decision]
    - path: architecture.md
      kind: architecture-baseline
      sourceOfTruth: true
      requiredFor: [decision, development, staging]
    - path: docs/engineering/development.md
      kind: engineering-operations
      sourceOfTruth: true
      requiredFor: [development, staging]
    - path: docs/operations/environments.md
      kind: environment-policy
      sourceOfTruth: true
      requiredFor: [decision, staging]
    - path: docs/governance/policies.md
      kind: governance-policy
      sourceOfTruth: true
      requiredFor: [decision, staging]
    - path: governance/role-assignments.json
      kind: role-assignments
      sourceOfTruth: true
      requiredFor: [work-order, staging]
    - path: AGENTS.md
      kind: agent-behavior
      sourceOfTruth: true
      requiredFor: [development]
    - path: docs/ai/context-pack.json
      kind: derived-context
      sourceOfTruth: false
      requiredFor: [work-order]
